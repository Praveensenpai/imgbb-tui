[package]
name = "imgbb-tui"
version = "0.1.0"
edition = "2021"
description = "A beautiful TUI to paste, upload and copy image URLs via imgbb"
repository = "https://github.com/Praveensenpai/imgbb-tui"
license = "MIT"

[[bin]]
name = "imgbb-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
anyhow = "1"
thiserror = "2"
base64 = "0.22"
futures = "0.3"

[profile.release]
opt-level = "z"
lto = true
strip = true